# Temporary name-only listing. Replaced by the one-off copy once the real
# vela Actions secret names are known. Does not print values, write secrets,
# or touch certificates.
name: Copy signing secrets to Sping (one-off)
on:
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: List vela Actions secret names
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          gh secret list --repo DarphV/vela --json name --jq '.[].name'
