# Einmalig: kopiert die vorhandenen Vela-Secrets nach DarphV/sping, ohne sie auszugeben.
# Quelle (Actions-Secrets in DarphV/vela): ASC_ISSUER_ID, ASC_KEY_ID, ASC_PRIVATE_KEY,
# VELA_DIST_P12_BASE64, VELA_DIST_P12_PASSWORD.
# DEVELOPMENT_TEAM ist in Vela kein Secret. Die Team-ID steht schon im vorhandenen
# Distribution-Zertifikat und wird nur gelesen. Es wird kein Zertifikat erstellt oder widerrufen.
# Zielnamen in DarphV/sping: ASC_ISSUER_ID, ASC_KEY_ID, ASC_PRIVATE_KEY, DEVELOPMENT_TEAM,
# APPLE_DIST_P12_BASE64, APPLE_DIST_P12_PASSWORD.
name: Copy signing secrets to Sping (one-off)
on:
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets nach DarphV/sping kopieren
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          V_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          V_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          V_ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          V_P12: ${{ secrets.VELA_DIST_P12_BASE64 }}
          V_P12_PASS: ${{ secrets.VELA_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          cleanup() { rm -rf "$work"; }
          trap cleanup EXIT

          require() {
            if [ -z "${2:-}" ]; then
              echo "missing source value for ${1}" >&2
              exit 1
            fi
          }
          require ASC_ISSUER_ID "$V_ASC_ISSUER_ID"
          require ASC_KEY_ID "$V_ASC_KEY_ID"
          require ASC_PRIVATE_KEY "$V_ASC_PRIVATE_KEY"
          require VELA_DIST_P12_BASE64 "$V_P12"
          require VELA_DIST_P12_PASSWORD "$V_P12_PASS"

          printf '%s' "$V_P12" | base64 -d > "$work/dist.p12"
          printf '%s' "$V_P12_PASS" > "$work/p12.pass"
          chmod 600 "$work/dist.p12" "$work/p12.pass"
          if ! openssl pkcs12 -in "$work/dist.p12" -nokeys -passin "file:$work/p12.pass" -legacy -out "$work/cert.pem" >/dev/null 2>"$work/openssl.err"; then
            if ! openssl pkcs12 -in "$work/dist.p12" -nokeys -passin "file:$work/p12.pass" -out "$work/cert.pem" >/dev/null 2>"$work/openssl.err"; then
              echo "Could not read the saved distribution certificate." >&2
              exit 1
            fi
          fi
          openssl x509 -in "$work/cert.pem" -noout -subject -nameopt RFC2253 > "$work/subject.txt"
          team="$(sed -n 's/.*OU=\([A-Z0-9]\{10\}\).*/\1/p' "$work/subject.txt" | head -1)"
          if [ -z "$team" ]; then
            team="$(sed -n 's/.*(\([A-Z0-9]\{10\}\)).*/\1/p' "$work/subject.txt" | head -1)"
          fi
          if ! [[ "$team" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "Saved distribution certificate has no Team ID. No secrets were written." >&2
            exit 1
          fi
          echo "::add-mask::${team}"

          put() {
            if [ -z "${2:-}" ]; then
              echo "refusing to set empty ${1}" >&2
              exit 1
            fi
            printf '%s' "$2" | gh secret set "$1" --repo DarphV/sping
            echo "set ${1}"
          }
          put ASC_ISSUER_ID "$V_ASC_ISSUER_ID"
          put ASC_KEY_ID "$V_ASC_KEY_ID"
          put ASC_PRIVATE_KEY "$V_ASC_PRIVATE_KEY"
          put DEVELOPMENT_TEAM "$team"
          put APPLE_DIST_P12_BASE64 "$V_P12"
          put APPLE_DIST_P12_PASSWORD "$V_P12_PASS"

          echo "sping secret names:"
          gh secret list --repo DarphV/sping --json name --jq '.[].name' | tee "$work/sping-names.txt"
          missing=0
          for name in ASC_ISSUER_ID ASC_KEY_ID ASC_PRIVATE_KEY DEVELOPMENT_TEAM APPLE_DIST_P12_BASE64 APPLE_DIST_P12_PASSWORD; do
            if ! grep -qx "$name" "$work/sping-names.txt"; then
              echo "missing on sping: ${name}" >&2
              missing=1
            fi
          done
          exit "$missing"
