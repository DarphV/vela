# Baut Vela in der Cloud auf einem GitHub-Mac (kein eigener Mac nötig).
# Der Job "unsigned" liefert eine unsignierte .ipa. Der Job "testflight"
# signiert automatisch mit dem App-Store-Connect-API-Schlüssel und lädt hoch.
name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    # This status-check branch must not archive or upload. The path does not
    # exist, so opening its pull request skips this workflow.
    paths:
      - "do-not-build-on-this-status-branch/**"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Vela (unsigned .ipa)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Xcode wählen (neuestes 26.x, sonst 16.x)
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${XC}" ]; then
            XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "${XC}" ]; then XC=/Applications/Xcode.app; fi
          echo "Using ${XC}"
          sudo xcode-select -s "${XC}/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: XcodeGen installieren
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: Bauen (Release, iphoneos, ohne Signatur)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Vela.xcodeproj \
            -scheme Vela \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log | (xcbeautify 2>/dev/null || cat)

      - name: .ipa packen
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/Vela.app
          test -d "$APP"
          ls -la "$APP"
          test -f "$APP/default.metallib" && echo "Metal-Bibliothek gefunden" || echo "WARNUNG: default.metallib fehlt"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Vela-unsigned.ipa Payload
          ls -la Vela-unsigned.ipa

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Vela-unsigned-ipa
          path: Vela-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Mac-Daemon bauen
        run: |
          set -euo pipefail
          cd MacCompanion
          swift build -c release --product vela-macd
          cp .build/release/vela-macd ../VelaMac-daemon
          chmod +x ../VelaMac-daemon

      - name: Mac-Daemon hochladen
        uses: actions/upload-artifact@v4
        with:
          name: VelaMac-daemon
          path: VelaMac-daemon
          if-no-files-found: error
          retention-days: 30

      - name: Simulator-Screenshots
        run: bash scripts/capture-screenshots.sh

      - name: Screenshots hochladen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Vela-screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 30

      - name: Build-Log bei Fehler hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

  testflight:
    name: Vela (TestFlight)
    runs-on: macos-15
    timeout-minutes: 90
    # Fork-PRs haben die Secrets nicht. Push, workflow_dispatch und PRs aus diesem Repo schon.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Xcode wählen (neuestes 26.x, sonst 16.x)
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${XC}" ]; then
            XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "${XC}" ]; then XC=/Applications/Xcode.app; fi
          echo "Using ${XC}"
          sudo xcode-select -s "${XC}/Contents/Developer"
          xcodebuild -version

      - name: XcodeGen installieren
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: Signieren und zu TestFlight hochladen
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          VELA_DIST_P12_BASE64: ${{ secrets.VELA_DIST_P12_BASE64 }}
          VELA_DIST_P12_PASSWORD: ${{ secrets.VELA_DIST_P12_PASSWORD }}
        run: bash scripts/asc-testflight.sh

      - name: TestFlight-Log bei Fehler hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-log
          path: testflight.log
          if-no-files-found: ignore
